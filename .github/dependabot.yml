version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Astro and its integrations move together; a split upgrade tends to break.
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@react-three/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
